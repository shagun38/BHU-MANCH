<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BHU-MANCH — Prototype (Demo Data)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f3f5f9;--card:#fff;--tx:#1b2333;--mu:#5d6779;--br:#dbe0ea;--pr:#1f3a6e;--g:#2e7d4f;--y:#b58500;--o:#d26a00;--r:#c62828;--b:#1e6fb8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141d;--card:#181f2c;--tx:#e8ecf3;--mu:#98a3b7;--br:#2a3446;--pr:#7ea3e6}}
:root[data-theme="dark"]{--bg:#0f141d;--card:#181f2c;--tx:#e8ecf3;--mu:#98a3b7;--br:#2a3446;--pr:#7ea3e6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:5;border-bottom:3px solid #e8892b}
.hd b{flex:1;font-size:17px}.hd button{background:none;border:0;color:#fff;font-size:22px;min-width:44px;min-height:44px}
.demo{font-size:11px;background:#fff3;padding:2px 8px;border-radius:9px}
main{padding:14px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.c{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:10px}
.c.t{cursor:pointer}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;color:#fff}
.g{background:var(--g)}.y{background:var(--y)}.o{background:var(--o)}.r{background:var(--r)}.b{background:var(--b)}.n{background:#6b7588}
.bar{height:8px;background:var(--br);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pr)}
button.p,input,select,textarea{font:inherit;width:100%;min-height:46px;border-radius:10px;border:1px solid var(--br);padding:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
button.p{background:var(--pr);color:#fff;border:0;font-weight:600}button.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--br);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav div{display:flex;width:100%;max-width:480px}.nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mu);min-height:56px;cursor:pointer}.nav a.on{color:var(--pr);font-weight:700}.nav a span{display:block;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs a{padding:9px 14px;border-radius:99px;border:1px solid var(--br);background:var(--card);white-space:nowrap;min-height:40px;cursor:pointer}.tabs a.on{background:var(--pr);color:#fff}
.tl{border-left:3px solid var(--br);margin-left:6px;padding-left:14px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--br)}.tl .d:before{background:var(--g)}.tl .w:before{background:var(--o)}
.bc{font-size:13px;color:var(--mu);margin-bottom:10px}.bc a{color:var(--pr);cursor:pointer}
.warn{border-left:5px solid var(--r)}.note{font-size:12px;color:var(--mu);border:1px dashed var(--br);border-radius:8px;padding:8px;margin:10px 0}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:8px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
svg text{font-family:inherit}.par{cursor:pointer;stroke:#fff;stroke-width:2}.par:hover{opacity:.8}
.login{padding:34px 20px}.logo{font-size:32px;font-weight:800;color:var(--pr);letter-spacing:.06em}

.sb,.notch{display:none}
@media(min-width:600px){
body{background:#0e1117;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.phone{position:relative;width:390px;height:min(820px,94vh);border:12px solid #1a1a1f;border-radius:48px;box-shadow:0 0 0 2px #555,0 30px 80px #000c;overflow:hidden;transform:translateZ(0);background:var(--bg);display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;padding:9px 24px 5px;font-size:12px;font-weight:600;background:#1f3a6e;color:#fff;flex:none}
.notch{display:block;position:absolute;top:6px;left:50%;transform:translateX(-50%);width:108px;height:22px;background:#000;border-radius:14px;z-index:20}
#app{flex:1;min-height:0;overflow-y:auto;max-width:none;padding-bottom:72px}
.nav{padding-bottom:0}
}
</style></head><body><div class="phone"><div class="notch"></div><div class="sb"><span>9:41</span><span>5G ▂▄▆ 🔋</span></div><div id="app"></div></div>
<script>
const $=id=>document.getElementById(id),T0=new Date(2026,8,24),fd=d=>new Date(T0-d*864e5).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const ST={A:['Acquired','g','#2e7d4f'],C:['Compensation Pending','y','#d4a017'],W:['Award Pending','o','#e07b00'],D:['Dispute / Bottleneck','r','#c62828'],R:['R&R Pending','b','#1e6fb8'],P:['Possession Pending','y','#d4a017']};
const PJ=[['Ahmedabad Metro Ph-2','Gujarat','GMRC-type agency','AACCDR','Naroda'],['NH-48 Widening Seg. 4','Maharashtra','Highway authority','AAPWCC','Palghar'],['Freight Corridor Link','Uttar Pradesh','Rail freight agency','CCDWRA','Etawah'],['Suburban Rail Line-2','Karnataka','Rail infra agency','DCCWAR','Yelahanka'],['Rail Yard Expansion','Bihar','Zonal railway','WWCDPA','Mokama'],['Coastal Road Stage-1','Tamil Nadu','State highways dept','AARRCP','Cuddalore']].map((a,i)=>({id:'P'+(i+1),n:a[0],st:a[1],ag:a[2],c:a[3],v:a[4],dl:[12,45,9,30,6,60][i]}));
const PR=[];PJ.forEach((p,i)=>{p.p=[];[...p.c].forEach((c,j)=>{const n=i*6+j,area=+(.6+(n*7%13)/10).toFixed(2),cp='ARP'.includes(c),ass=+(area*.9).toFixed(2),o={id:'BM-'+(1001+n),ul:String(24010000000000+n*7919137),c,area,d:20+(i*7+j*13)%150,aw:c!='W',cp,ps:'AR'.includes(c),rr:c=='A',fam:4+n*3%9,ass,paid:cp?ass:c=='C'?+(ass*.4).toFixed(2):0,pj:p,j};p.p.push(o);PR.push(o)})});
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),pct=(a,f)=>Math.round(100*a.filter(f).length/a.length),f1=x=>x.toFixed(1);
const RULES=[['Compensation Delay','HIGH','Compensation','Review pending compensation records; release payment or record reason','District LAO','IF award=done AND compensation=pending AND days_since_award>90',o=>o.aw&&!o.cp&&o.c=='C'&&o.d>90],['Possession Pending','MED','Possession','Schedule possession handover with project agency','District LAO','IF compensation=paid AND possession=pending',o=>o.c=='P'],['R&R Action Required','MED','R&R','Verify affected families and start R&R entitlements','R&R Officer','IF possession=done AND R&R=pending',o=>o.c=='R'],['Litigation / Dispute','HIGH','Award','Escalate to State Authority; attach court/objection records','State Authority','IF dispute_flag=true',o=>o.c=='D'],['Award Pending','MED','Award','Expedite award declaration under S.23','District LAO','IF award=pending AND days_since_notification>60',o=>o.c=='W'&&o.d>60]];
const hits=o=>RULES.filter(r=>r[6](o)),bn=o=>PR.filter(o=>hits(o).length);
const S={u:null,role:'District LAO',v:'login',a:null,h:[],q:3,tab:'Status'};
const ROLES=['District LAO','State Authority','Central Ministry','Project Implementing Agency','Citizen'];
const AUD=[['10:42 AM','Officer (LAO)','Uploaded field evidence','BM-1024'],['10:38 AM','Officer (LAO)','Compensation record updated','BM-1019'],['09:51 AM','Officer (LAO)','Award document v2 uploaded','BM-1003'],['Yesterday','State Authority','Status changed to "Award Completed"','BM-1010'],['Yesterday','System (rule engine)','Bottleneck flagged: Compensation Delay','BM-1004'],['2 days ago','Project Agency','Milestone date revised','P4']];
const NOTI=[['Compensation pending for 8 parcels','P1'],['Project milestone due in 7 days','P5'],['R&R verification pending for 12 families','P6'],['Field evidence uploaded for Parcel BM-1024','BM-1024'],['Document version updated: Award_1003.pdf','BM-1003']];
const chip=(t,c)=>`<span class="chip ${c}">${t}</span>`,sc=o=>chip(ST[o.c][0],ST[o.c][1]),bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const pAcq=p=>Math.round(100*sum(p.p.filter(o=>o.c=='A'),o=>o.area)/sum(p.p,o=>o.area));
const go=(v,a)=>{S.h.push([S.v,S.a,S.tab]);S.v=v;S.a=a;S.tab='Status';R()},back=()=>{[S.v,S.a,S.tab]=S.h.pop()||['home',null,'Status'];R()},tab=v=>{S.h=[];S.v=v;S.a=null;R()};
const P_=id=>PJ.find(p=>p.id==id),O_=id=>PR.find(o=>o.id==id);
function nav(){const it=S.role=='Citizen'?[['home','🏠','Status'],['more','☰','More']]:[['home','🏠','Home'],['projects','📁','Projects'],S.role=='District LAO'?['field','📷','Field']:['bn','⚠','Issues'],['alerts','🔔','Alerts'],['more','☰','More']];return`<div class="nav"><div>${it.map(i=>`<a class="${S.v==i[0]?'on':''}" onclick="tab('${i[0]}')"><span>${i[1]}</span>${i[2]}</a>`).join('')}</div></div>`}
function hdr(t,b){return`<div class="hd">${b?'<button aria-label="Back" onclick="back()">←</button>':''}<b>${t}</b><span class="demo">DEMO DATA</span></div>`}
function R(){const v=S.v;let h='';if(v=='login'){app.innerHTML=login();return}
const V={home:home,projects:projects,project:project,map:map,twin:twin,bn:bnv,field:field,docs:docs,alerts:alerts,national:national,citizen:citizen,audit:audit,more:more,arch:arch}[v];const r=V(S.a);app.innerHTML=hdr(r[0],S.h.length>0)+`<main>${r[1]}</main>`+nav();app.scrollTop=0;scrollTo(0,0)}
function login(){return`<div class="login"><div class="logo">BHU-MANCH</div><div class="mu">National Land Acquisition Monitoring &amp; Decision Support</div><div class="note" style="margin:18px 0"><b>Prototype Demo Login</b> — no real authentication. Any credentials (or none) will sign you in.</div><label>Employee / User ID</label><input id="u" placeholder="e.g. LAO-2041"><label>Password</label><input id="pw" type="password" placeholder="any value"><label>Role</label><select id="rl">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select><button class="p" onclick="S.role=$('rl').value;S.u=$('u').value||'demo.officer';S.v='home';R()">Log in (Demo)</button><div class="mu">Demo environment · mock data · no live government systems connected</div></div>`}
function home(){if(S.role=='Citizen')return citizen();if(S.role!='District LAO'&&S.role!='Project Implementing Agency')return national();
const cp=PR.filter(o=>o.c=='C').length,l=[['Compensation pending',PR.filter(o=>o.c=='C').length,'parcels'],['Possession delayed',PR.filter(o=>o.c=='P').length+PR.filter(o=>o.c=='C').length,'parcels'],['R&R verification pending',sum(PR.filter(o=>o.c=='R'),o=>o.fam),'families'],['Document review pending',9,'parcels']];
return['Officer Dashboard',`<h3 style="margin:0">Good morning, Officer</h3><div class="mu">${S.role} · ${S.u}</div><h2>Overview</h2><div class="grid">${[['Projects',PJ.length],['Land Proposed',f1(sum(PR,o=>o.area))+' ha'],['Land Acquired',f1(sum(PR.filter(o=>o.c=='A'),o=>o.area))+' ha'],['Compensation Pending','₹'+f1(sum(PR,o=>o.ass-o.paid))+' Cr'],['R&R Pending',sum(PR.filter(o=>!o.rr&&o.ps),o=>o.fam)+' fam.'],['Critical Parcels',bn().length]].map(k=>`<div class="c"><div class="mu">${k[0]}</div><div class="k">${k[1]}</div></div>`).join('')}</div><h2>Priority Actions</h2>${l.map(x=>`<div class="c t warn" onclick="tab('bn')">⚠ ${x[0]} — <b>${x[1]} ${x[2]}</b></div>`).join('')}<h2>Projects Nearing Deadline</h2>${[...PJ].sort((a,b)=>a.dl-b.dl).slice(0,3).map(pc).join('')}`]}
const pc=p=>`<div class="c t" onclick="go('project','${p.id}')"><div class="row"><b>${p.n}</b>${chip(p.dl<15?'Due in '+p.dl+' d':'On track',p.dl<15?'r':'g')}</div><div class="mu">${p.st} · ${p.ag}</div>${bar(pAcq(p))}<div class="row mu"><span>Acquired ${pAcq(p)}%</span><span>${p.p.length} parcels</span></div></div>`;
function projects(){return['Projects',`<input placeholder="🔍 Search projects" oninput="for(const e of document.querySelectorAll('.c.t'))e.style.display=e.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none'">${PJ.map(p=>{const a=p.p;return`<div class="c t" onclick="go('project','${p.id}')"><div class="row"><b>${p.n}</b>${chip(p.dl<15?'Due '+p.dl+'d':'On track',p.dl<15?'r':'g')}</div><div class="mu">${p.st} · ${p.ag}</div><div class="mu">Proposed ${f1(sum(a,o=>o.area))} ha · Acquired ${f1(sum(a.filter(o=>o.c=='A'),o=>o.area))} ha</div>${bar(pAcq(p))}<div class="mu">Compensation ${pct(a,o=>o.cp)}% · Possession ${pct(a,o=>o.ps)}% · R&amp;R ${pct(a,o=>o.rr)}%</div></div>`}).join('')}`]}
function project(id){const p=P_(id),a=p.p,st=[['Proposal',100],['Notification',100],['Award',pct(a,o=>o.aw)],['Compensation',pct(a,o=>o.cp)],['Possession',pct(a,o=>o.ps)],['R&R',pct(a,o=>o.rr)],['Completion',pAcq(p)]],b=a.filter(o=>hits(o).length),top=RULES.map(r=>[r,a.filter(r[6]).length]).sort((x,y)=>y[1]-x[1])[0];
return[p.n,`<div class="c"><b>${p.n}</b><div class="mu">${p.v}, ${p.st} · ${p.ag}</div><div class="grid" style="margin-top:8px"><div><div class="mu">Proposed</div><b>${f1(sum(a,o=>o.area))} ha</b></div><div><div class="mu">Acquired</div><b>${f1(sum(a.filter(o=>o.c=='A'),o=>o.area))} ha</b></div><div><div class="mu">Parcels</div><b>${a.length}</b></div><div><div class="mu">Affected families</div><b>${sum(a,o=>o.fam)}</b></div></div></div>${top[1]?`<div class="c warn t" onclick="go('bn','${p.id}')"><b>⚠ Attention Required</b><div>${top[0][0]} — ${top[1]} parcel(s)</div><div class="mu">${top[0][3]}</div></div>`:''}<button class="p" onclick="go('map','${p.id}')">🗺 Open Parcel Map</button><h2>Lifecycle progress</h2><div class="c">${st.map(s=>`<div class="row"><span>${s[0]}</span><b>${s[1]}%</b></div>${bar(s[1])}`).join('')}</div>`]}
function map(id){const p=P_(id),pts=p.p.map(o=>{const k=o.j%3,r=Math.floor(o.j/3),x=22+k*110,y=34+r*118,j=o.j*5%9;return`<polygon class="par" tabindex="0" fill="${ST[o.c][2]}" points="${x+j},${y} ${x+98},${y+j} ${x+92-j},${y+92} ${x},${y+84+j}" onclick="go('twin','${o.id}')"/><text x="${x+46}" y="${y+48}" font-size="11" fill="#fff" text-anchor="middle" pointer-events="none">${o.id}</text>`}).join('');
return[p.n+' · Map',`<div class="bc"><a onclick="go('project','${p.id}')">Project</a> › Parcel map</div><div class="c" style="padding:6px"><svg viewBox="0 0 360 290" width="100%" role="img" aria-label="Demo parcel map"><rect width="360" height="290" fill="#e8efe2"/><path d="M0 155 Q120 140 200 165 T360 150" stroke="#9aa3b2" stroke-width="16" fill="none"/><path d="M0 155 Q120 140 200 165 T360 150" stroke="#fff" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/><path d="M300 0 Q270 120 330 290" stroke="#9cc3e6" stroke-width="10" fill="none"/><rect x="10" y="20" width="340" height="252" fill="none" stroke="#1f3a6e" stroke-width="2" stroke-dasharray="7 4"/>${pts}<text x="14" y="15" font-size="10" fill="#1f3a6e">Project boundary (demo)</text><text x="150" y="163" font-size="9" fill="#333">Main road</text><text x="292" y="285" font-size="9" fill="#2a6ea8">River</text><circle cx="185" cy="270" r="4" fill="#333"/><text x="192" y="273" font-size="9">Station (demo)</text></svg><div class="lg">${Object.values(ST).map(s=>`<span><i style="background:${s[2]}"></i>${s[0]}</span>`).join('')}</div></div><div class="note">Demo map layer: schematic parcels drawn locally. No live Bhu-Naksha / cadastral data. Tap a parcel to open its Digital Twin.</div>`]}
function twin(id){const o=O_(id),H=hits(o),TB=['Status','Money','R&R','Docs','Timeline'],ok=(b,l)=>`<div class="row c"><span>${l}</span>${b?chip('Completed','g'):chip('Pending','o')}</div>`;let t='';
if(S.tab=='Status')t=`<div class="c"><div class="grid mu"><div>ULPIN (demo ref)<br><b>${o.ul}</b></div><div>Area<br><b>${o.area} ha</b></div><div>Village<br><b>${o.pj.v}</b></div><div>State<br><b>${o.pj.st}</b></div><div>Land type<br><b>${o.j%2?'Agricultural':'Non-agri'}</b></div><div>Project<br><b>${o.pj.n}</b></div></div></div><h2>Legal / acquisition status</h2>${ok(1,'Notification (S.4)')}${ok(o.aw,'Award (S.23)')}${ok(o.cp,'Compensation')}${ok(o.ps,'Possession')}<div class="row c"><span>R&amp;R</span>${o.rr?chip('Completed','g'):o.ps?chip('In progress','b'):chip('Not started','n')}</div>`;
if(S.tab=='Money')t=`<div class="c"><div class="row"><span>Assessed</span><b>₹${o.ass} Cr</b></div><div class="row"><span>Paid</span><b>₹${o.paid} Cr</b></div><div class="row"><span>Pending</span><b>₹${+(o.ass-o.paid).toFixed(2)} Cr</b></div>${bar(Math.round(100*o.paid/o.ass))}</div>`;
if(S.tab=='R&R'){const dp=Math.min(o.fam,3+o.j%3);t=`<div class="grid"><div class="c"><div class="mu">Affected</div><div class="k">${o.fam}</div></div><div class="c"><div class="mu">Displaced</div><div class="k">${dp}</div></div><div class="c"><div class="mu">R&amp;R completed</div><div class="k">${o.rr?o.fam:0}</div></div><div class="c"><div class="mu">R&amp;R pending</div><div class="k">${o.rr?0:o.fam}</div></div></div>`}
if(S.tab=='Docs')t=DOCS(o).map(d=>`<details class="c"><summary><b>${d[0]}</b> ${chip(d[2],d[2]=='Verified'?'g':'o')}<div class="mu">v${d[1]} · ${o.id} · Uploaded by LAO · ${fd(o.d)}</div></summary><div class="mu" style="margin-top:8px">Version history: ${Array.from({length:d[1]},(_,i)=>'v'+(i+1)).join(' → ')}<br>Audit: uploaded → reviewed (demo)</div></details>`).join('')+`<div class="c">📷 Field evidence: ${o.c=='A'||o.j%2?'Site photo + geo-tag on file (demo)':'None uploaded'}</div>`;
if(S.tab=='Timeline'){const E=[['Notification (S.4)',o.d+70,1],['Award (S.23)',o.d,o.aw],['Compensation',o.d-10,o.cp],['Possession',o.d-25,o.ps],['R&R',o.d-40,o.rr]];t=`<div class="tl">${E.map(e=>`<div class="${e[2]?'d':'w'}"><b>${e[0]}</b><div class="mu">${e[2]?fd(Math.max(e[1],1)):'Pending'}</div></div>`).join('')}</div><h2>Activity</h2>${AUD.slice(0,3).map(a=>`<div class="mu">${a[0]} — ${a[2]} (${a[1]})</div>`).join('')}`}
return['Parcel Digital Twin',`<div class="bc"><a onclick="tab('projects')">Projects</a> › <a onclick="go('project','${o.pj.id}')">${o.pj.n}</a> › ${o.id}</div><div class="c"><div class="row"><b style="font-size:20px">${o.id}</b>${sc(o)}</div><div class="mu">One parcel · one complete story</div></div>${H.map(r=>`<div class="c warn"><b>⚠ BOTTLENECK DETECTED — ${r[0]}</b> ${chip(r[1],r[1]=='HIGH'?'r':'o')}<div class="mu">${r[5]}</div><div><b>Next action:</b> ${r[3]}</div><div class="mu">Responsible: ${r[4]}</div></div>`).join('')}<div class="tabs">${TB.map(x=>`<a class="${S.tab==x?'on':''}" onclick="S.tab='${x}';R()">${x}</a>`).join('')}</div>${t}`]}
const DOCS=o=>{const d=[['Notification_'+o.id+'.pdf',1,'Verified']];if(o.aw)d.push(['Award_'+o.id+'.pdf',2,'Verified']);if(o.cp||o.c=='C')d.push(['Compensation_'+o.id+'.pdf',1,o.cp?'Verified':'Under review']);if(o.ps)d.push(['Possession_'+o.id+'.pdf',1,'Verified']);return d};
function bnv(id){const A=id?P_(id).p:PR;return['Bottleneck Intelligence',`<div class="note"><b>Rule-Based Bottleneck Detection</b> — deterministic, explainable rules on parcel status. Not AI prediction.</div>${RULES.map(r=>{const m=A.filter(r[6]);return m.length?`<div class="c warn"><b>⚠ ${r[0]}</b> ${chip(r[1],r[1]=='HIGH'?'r':'o')}<div class="mu"><code>${r[5]}</code></div><div><b>${m.length}</b> parcels · Stage: ${r[2]}</div><div><b>Next action:</b> ${r[3]}</div><div class="mu">Responsible: ${r[4]}</div><div style="margin-top:6px">${m.map(o=>`<a onclick="go('twin','${o.id}')" style="color:var(--pr);margin-right:10px;cursor:pointer;display:inline-block;padding:6px 0">${o.id}</a>`).join('')}</div></div>`:''}).join('')}`]}
function field(){return['Field Verification',`<div class="c row"><span>${S.q?'📴 Saved Offline — '+S.q+' records waiting to sync':'✅ All records synced'}</span></div><button class="p s" onclick="S.q=0;R()">Sync Now (simulated)</button><label>Project</label><select id="fp" onchange="$('fo').innerHTML=PJ.find(p=>p.id==this.value).p.map(o=>'<option>'+o.id+'</option>')">${PJ.map(p=>`<option value="${p.id}">${p.n}</option>`)}</select><label>Parcel</label><select id="fo">${PJ[0].p.map(o=>`<option>${o.id}</option>`)}</select><label>Site photograph</label><input type="file" accept="image/*" capture="environment"><button class="p s" onclick="navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>$('gps').textContent='📍 '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),()=>$('gps').textContent='📍 23.0225, 72.5714 (demo)'):0;$('gps').textContent='📍 23.0225, 72.5714 (demo)'">📍 Add GPS location</button><div id="gps" class="mu"></div><label>Officer note</label><textarea rows="3" id="nt" placeholder="Observation"></textarea><label>Verification status</label><select><option>Verified</option><option>Needs follow-up</option><option>Disputed</option></select><button class="p" onclick="S.q++;AUD.unshift(['Just now','Officer (LAO)','Uploaded field evidence',$('fo').value]);R();alert('Saved offline (demo). Tap Sync Now to sync.')">Submit evidence</button><div class="note">Simulated offline queue. No real offline database or live sync.</div>`]}
function docs(){return['Documents',PR.filter(o=>hits(o).length).slice(0,6).map(o=>DOCS(o).slice(-1).map(d=>`<div class="c t" onclick="go('twin','${o.id}')"><b>${d[0]}</b> ${chip(d[2],d[2]=='Verified'?'g':'o')}<div class="mu">v${d[1]} · ${o.pj.n} · ${fd(o.d)}</div></div>`).join('')).join('')+'<div class="note">No real government document validation. Open a parcel → Docs for version &amp; audit history.</div>']}
function alerts(){return['Notifications',NOTI.map(n=>`<div class="c t" onclick="go('${n[1][0]=='B'?'twin':'project'}','${n[1]}')">🔔 ${n[0]}<div class="mu">Tap to open</div></div>`).join('')]}
const states=()=>[...new Set(PJ.map(p=>p.st))];
function national(id){const A=PR,pr=PJ;let body;
if(S.a&&S.a.s&&!S.a.p)body=`<div class="bc"><a onclick="S.a=null;R()">India</a> › ${S.a.s}</div>`+PJ.filter(p=>p.st==S.a.s).map(pc).join('');
else body=`<div class="grid">${[['Projects',pr.length],['Land proposed',f1(sum(A,o=>o.area))+' ha'],['Compensation assessed','₹'+f1(sum(A,o=>o.ass))+' Cr'],['Compensation paid','₹'+f1(sum(A,o=>o.paid))+' Cr'],['Affected families',sum(A,o=>o.fam)],['R&R progress',pct(A,o=>o.rr)+'%'],['Possession',pct(A,o=>o.ps)+'%'],['Critical bottlenecks',bn().length]].map(k=>`<div class="c"><div class="mu">${k[0]}</div><div class="k" style="font-size:19px">${k[1]}</div></div>`).join('')}</div><h2>State-wise progress (tap to drill down)</h2>${states().map(s=>{const a=PR.filter(o=>o.pj.st==s);return`<div class="c t" onclick="S.a={s:'${s}'};R()"><div class="row"><b>${s}</b><span class="mu">${bn().filter(o=>o.pj.st==s).length} critical</span></div>${bar(pct(a,o=>o.c=='A'))}<div class="mu">Acquired ${pct(a,o=>o.c=='A')}% · Possession ${pct(a,o=>o.ps)}%</div></div>`}).join('')}<h2>Timeline adherence</h2>${PJ.map(p=>`<div class="row c t" onclick="go('project','${p.id}')"><span>${p.n}</span>${chip(p.dl<15?'At risk':p.dl<35?'Watch':'On track',p.dl<15?'r':p.dl<35?'y':'g')}</div>`).join('')}<button class="p" onclick="go('bn')">View critical bottlenecks</button>`;
return['National → State → Project',body+'<div class="note">National → State → Project → Parcel drill-down. Demo data only.</div>']}
function citizen(){const r=S.cref||'BM-1024',o=O_(r.toUpperCase());return['Citizen Status View',`<div class="note">Read-only view. You cannot modify official records.</div><label>Project / Parcel reference</label><input id="cr" value="${r}"><button class="p" onclick="S.cref=$('cr').value;R()">Check status</button>${o?`<div class="c"><b>${o.id}</b> · ${o.pj.n}<div class="mu">${o.pj.v}, ${o.pj.st}</div></div>${[['Acquisition',o.aw],['Compensation',o.cp],['Possession',o.ps],['R&R',o.rr]].map(x=>`<div class="c row"><span>${x[0]} status</span>${x[1]?chip('Completed','g'):chip('In progress','o')}</div>`).join('')}<div class="c mu">Important dates: Notification ${fd(o.d+70)}${o.aw?' · Award '+fd(o.d):''}</div>`:'<div class="c">No record found. Try BM-1001 to BM-1036.</div>'}<div class="note">Information shown is for status tracking. Final legal decisions and records remain with the competent authority.</div>`]}
function audit(){return['Activity / Audit History',AUD.map(a=>`<div class="c"><b>${a[2]}</b><div class="mu">${a[0]} · ${a[1]} · ${a[3]}</div></div>`).join('')]}
function arch(){return['Architecture (Prototype)',`<div class="c">BHU-MANCH<br>↓ Unified data model (Project → Parcel → Status/Compensation/Families/Docs/Evidence)<br>↓ Adapter layer (mock)<br>↓ Existing systems</div>${['ULPIN / DILRMP','Bhu-Naksha','LACRRIS','NGDRS','PM GatiShakti'].map(s=>`<div class="row c"><span>${s}</span>${chip('Potential / Adapter (mock)','n')}</div>`).join('')}<div class="note">No live integration is claimed. All data in this prototype is synthetic.</div>`]}
function more(){const L=[['national','National / State dashboard'],['bn','Bottleneck Intelligence'],['docs','Documents'],['audit','Audit history'],['citizen','Citizen view (read-only)'],['arch','Adapter architecture']];return['More',`<div class="c">Signed in as <b>${S.role}</b><div class="mu">${S.u}</div></div>${L.map(l=>`<div class="c t" onclick="go('${l[0]}')">${l[1]} ›</div>`).join('')}<label>Switch role (demo)</label><select onchange="S.role=this.value;tab('home')">${ROLES.map(r=>`<option ${r==S.role?'selected':''}>${r}</option>`).join('')}</select><button class="p s" onclick="S.v='login';R()">Log out</button>`]}
R();
